<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Transaction Software</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7fb;
  color:#202124;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
}

.hidden{
  display:none!important;
}

.page{
  display:none;
  min-height:100vh;
}

.page.active{
  display:block;
}

/* =====================================================
   LOGIN
===================================================== */

#loginPage{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f5f7fb;
}

#loginPage.active{
  display:flex;
}

.login-card{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:20px;
  padding:30px 24px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo-circle{
  width:62px;
  height:62px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eef3ff;
  font-size:28px;
}

.login-card h1{
  margin:0;
  text-align:center;
  font-size:25px;
}

.subtitle{
  margin:7px 0 25px;
  text-align:center;
  color:#777;
  font-size:14px;
}

/* =====================================================
   APP
===================================================== */

.app-container{
  width:100%;
  max-width:650px;
  min-height:100vh;
  margin:auto;
  background:#f5f7fb;
}

/* =====================================================
   HEADER
===================================================== */

.top-header{
  min-height:72px;
  padding:15px 18px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e9edf3;
}

.top-header h2{
  margin:0;
  font-size:18px;
  font-weight:800;
}

.top-header span{
  display:block;
  margin-top:4px;
  font-size:12px;
  color:#777;
}

.logout-btn{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#f2f4f7;
  cursor:pointer;
  font-size:19px;
}

/* =====================================================
   ADMIN
===================================================== */

.admin-content{
  padding:14px;
}

.admin-buttons{
  display:flex;
  gap:10px;
  width:100%;
  margin-bottom:14px;
}

.admin-main-btn{
  flex:1;
  min-width:0;
  height:52px;
  padding:8px 10px;
  border-radius:12px;
  background:#fff;
  border:1px solid #e5e9ef;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
}

.admin-main-btn:active{
  transform:scale(.97);
}

.admin-main-btn.active{
  background:#111;
  border-color:#111;
  color:#fff;
}

.admin-main-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  flex-shrink:0;
}

.admin-main-btn strong{
  display:block;
  font-size:13px;
  font-weight:800;
}

.admin-panel-section{
  display:none;
  background:#fff;
  border:1px solid #e6e9ee;
  border-radius:15px;
  overflow:hidden;
}

.admin-panel-section.active{
  display:block;
}

/* =====================================================
   FORM
===================================================== */

.form-container,
.details-container,
.viewer-container{
  padding:16px;
}

.input-group{
  margin-bottom:14px;
}

.input-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:#444;
}

input,
select{
  width:100%;
  height:54px;
  padding:0 12px;
  border:1px solid #dfe3e8;
  border-radius:11px;
  outline:none;
  background:#fff;
  color:#222;
  font-size:14px;
}

input:focus,
select:focus{
  border-color:#7185ff;
  box-shadow:0 0 0 3px rgba(113,133,255,.10);
}

.amount-input{
  text-align:left;
  font-variant-numeric:tabular-nums;
}

/* =====================================================
   PASSWORD
===================================================== */

.password-box{
  position:relative;
}

.password-box input{
  padding-right:50px;
}

.eye-btn{
  position:absolute;
  right:5px;
  top:4px;
  width:36px;
  height:36px;
  background:transparent;
  cursor:pointer;
}

/* =====================================================
   PRIMARY
===================================================== */

.primary-btn{
  width:100%;
  height:46px;
  border-radius:11px;
  background:#5267e8;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  margin-top:4px;
}

.primary-btn:active{
  transform:scale(.99);
}

/* =====================================================
   TYPE
===================================================== */

.type-row{
  display:flex;
  gap:10px;
  margin:3px 0 14px;
}

.type-btn{
  flex:1;
  height:44px;
  border-radius:11px;
  background:#fff;
  border:1px solid #dfe3e8;
  color:#555;
  font-weight:700;
  cursor:pointer;
}

.type-btn.active{
  background:#111;
  border-color:#111;
  color:#fff;
}

/* =====================================================
   DETAILS FILTER
===================================================== */

.details-filter-row{
  display:flex;
  align-items:center;
  gap:6px;
  width:100%;
  margin-bottom:12px;
}

.details-filter-row select{
  height:34px;
  padding:0 7px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  min-width:0;
}

.details-filter-row .filter-year{
  width:27%;
}

.details-filter-row .filter-month{
  width:31%;
}

.details-filter-row .filter-name{
  flex:1;
}

/* =====================================================
   BALANCE
===================================================== */

.balance-card{
  padding:10px 12px;
  border-radius:11px;
  background:#111;
  border:1px solid #111;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  margin-bottom:9px;
  display:flex;
  align-items:stretch;
  justify-content:space-between;
  gap:0;
  color:#fff;
  overflow:hidden;
}

.balance-left,
.balance-sales{
  flex:1;
  min-width:0;
  padding:3px 10px;
}

.balance-left{
  text-align:left;
}

.balance-sales{
  text-align:right;
  border-left:1px solid rgba(255,255,255,.22);
}

.balance-left span,
.balance-sales span{
  display:block;
  font-size:9px;
  font-weight:700;
  color:#aaa;
  letter-spacing:.2px;
}

.balance-left strong{
  display:block;
  margin-top:2px;
  font-size:17px;
  line-height:1.15;
  color:#fff;
}

.balance-sales strong{
  display:block;
  margin-top:2px;
  font-size:16px;
  line-height:1.15;
  color:#fff;
}

.sales-filter{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  width:100%;
}

.sales-filter select{
  width:auto;
  height:30px;
  min-width:75px;
  padding:0 7px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.sales-filter .year-select{
  min-width:68px;
}

.sales-filter .month-select{
  min-width:95px;
}

/* =====================================================
   TRANSACTIONS
===================================================== */

.transactions-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:9px 0 8px;
}

.transactions-header h3{
  margin:0;
  font-size:13px;
  font-weight:800;
}

.transaction-list{
  max-height:calc(100vh - 330px);
  min-height:120px;
  overflow-y:auto;
  padding-right:2px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.transaction-list::-webkit-scrollbar{
  width:4px;
}

.transaction-list::-webkit-scrollbar-thumb{
  background:#cbd0d8;
  border-radius:10px;
}

/* =====================================================
   TRANSACTION CARD
===================================================== */

.transaction-card{
  min-height:58px;
  margin-bottom:6px;
  padding:6px 10px;
  background:#fff;
  border:1px solid #e6e9ee;
  border-left:4px solid #aaa;
  border-radius:9px;
  display:flex;
  align-items:stretch;
  justify-content:space-between;
  gap:10px;
}

.transaction-card.sale{
  border-left-color:#d9534f;
}

.transaction-card.payment{
  border-left-color:#34a56f;
}

/* LEFT */

.transaction-info{
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.transaction-date{
  font-size:9px;
  line-height:1;
  color:#888;
  font-weight:400;
}

.transaction-amount{
  font-size:16px;
  line-height:1;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.transaction-method{
  font-size:9px;
  line-height:1;
  color:#777;
  font-weight:400;
}

/* RIGHT */

.transaction-type{
  flex-shrink:0;
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
  padding-top:1px;
  font-size:11px;
  line-height:1;
  font-weight:800;
}

/* =====================================================
   VIEWER
===================================================== */

.viewer-history{
  margin-top:12px;
}

.viewer-history h3{
  margin:0 0 8px;
  font-size:13px;
  font-weight:800;
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
  min-height:20px;
  margin-top:9px;
  text-align:center;
  font-size:13px;
  color:#d34c4c;
}

.message.success{
  color:#159447;
  font-weight:700;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(255,255,255,.72);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:13px;
  color:#555;
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #ddd;
  border-top-color:#5267e8;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:420px){

  .admin-content{
    padding:11px;
  }

  .admin-buttons{
    gap:8px;
  }

  .admin-main-btn{
    height:48px;
    padding:7px 8px;
    gap:5px;
  }

  .admin-main-icon{
    font-size:16px;
  }

  .admin-main-btn strong{
    font-size:11px;
  }

  .form-container,
  .details-container,
  .viewer-container{
    padding:13px;
  }

  .sales-filter select{
    height:29px;
    font-size:10px;
  }

  .sales-filter .year-select{
    min-width:64px;
  }

  .sales-filter .month-select{
    min-width:88px;
  }

  .details-filter-row{
    gap:5px;
  }

  .details-filter-row select{
    height:32px;
    font-size:10px;
    padding:0 6px;
  }

  .details-filter-row .filter-year{
    width:25%;
  }

  .details-filter-row .filter-month{
    width:30%;
  }

  .transaction-list{
    max-height:calc(100vh - 300px);
  }

  .transaction-card{
    min-height:56px;
    padding:6px 9px;
  }

  .transaction-amount{
    font-size:15px;
  }

  .transaction-date,
  .transaction-method{
    font-size:8.5px;
  }

  .transaction-type{
    font-size:10.5px;
  }

}

@media(max-width:340px){

  .admin-buttons{
    gap:6px;
  }

  .admin-main-btn{
    height:46px;
    padding:6px;
  }

  .admin-main-icon{
    font-size:15px;
  }

  .admin-main-btn strong{
    font-size:10px;
  }

  .sales-filter .year-select{
    min-width:60px;
  }

  .sales-filter .month-select{
    min-width:80px;
  }

  .details-filter-row select{
    font-size:9px;
  }

  .transaction-card{
    min-height:54px;
  }

  .transaction-amount{
    font-size:14px;
  }

}

</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginPage" class="page active">

  <div class="login-card">

    <div class="logo-circle">🔐</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to continue
    </p>

    <div class="input-group">

      <label>Username</label>

      <input
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="username"
      >

    </div>

    <div class="input-group">

      <label>Password</label>

      <div class="password-box">

        <input
          id="password"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
        >

        <button
          type="button"
          class="eye-btn"
          onclick="togglePassword()"
        >👁️</button>

      </div>

    </div>

    <button
      class="primary-btn"
      onclick="loginUser()"
    >
      LOGIN
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>

</section>


<!-- =====================================================
     ADMIN
===================================================== -->

<section id="adminPage" class="page">

  <div class="app-container">

    <header class="top-header">

      <div>

        <h2>ADMIN PANEL</h2>

        <span id="adminWelcome">
          Welcome
        </span>

      </div>

      <button
        class="logout-btn"
        onclick="logout()"
      >🚪</button>

    </header>


    <main class="admin-content">

      <div class="admin-buttons">

        <button
          id="addTransactionBtn"
          class="admin-main-btn active"
          onclick="openAddTransaction()"
        >

          <span class="admin-main-icon">
            ✚
          </span>

          <strong>
            Add Transaction
          </strong>

        </button>


        <button
          id="checkDetailsBtn"
          class="admin-main-btn"
          onclick="openCheckDetails()"
        >

          <span class="admin-main-icon">
            📋
          </span>

          <strong>
            Check Details
          </strong>

        </button>

      </div>


      <!-- =================================================
           ADD TRANSACTION
      ================================================= -->

      <section
        id="addTransactionSection"
        class="admin-panel-section active"
      >

        <main class="form-container">

          <div class="input-group">

            <label>📅 Date</label>

            <input
              id="transactionDate"
              type="date"
            >

          </div>


          <div class="input-group">

            <label>💰 Amount</label>

            <input
              id="transactionAmount"
              class="amount-input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="1,000"
            >

          </div>


          <div class="input-group">

            <label>👤 Name</label>

            <select id="transactionName">

              <option value="">
                Select Name
              </option>

            </select>

          </div>


          <div class="type-row">

            <button
              id="saleBtn"
              class="type-btn active"
              onclick="selectType('বিক্রয়')"
            >
              ✚ বিক্রয়
            </button>

            <button
              id="paymentBtn"
              class="type-btn"
              onclick="selectType('পেমেন্ট')"
            >
              ➖ পেমেন্ট
            </button>

          </div>


          <input
            id="transactionType"
            type="hidden"
            value="বিক্রয়"
          >


          <div class="input-group">

            <label id="methodLabel">
              বিক্রয়ের ধরন
            </label>

            <select id="transactionMethod">

              <option value="">
                Select
              </option>

            </select>

          </div>


          <button
            class="primary-btn"
            onclick="saveTransaction()"
          >
            💾 SAVE
          </button>


          <div
            id="transactionMessage"
            class="message"
          ></div>

        </main>

      </section>


      <!-- =================================================
           CHECK DETAILS
      ================================================= -->

      <section
        id="checkDetailsSection"
        class="admin-panel-section"
      >

        <main class="details-container">

          <div class="details-filter-row">

            <select
              id="yearSelect"
              class="filter-year"
              onchange="loadCustomerDetails(true)"
            ></select>


            <select
              id="monthSelect"
              class="filter-month"
              onchange="loadCustomerDetails(true)"
            ></select>


            <select
              id="detailsName"
              class="filter-name"
              onchange="loadCustomerDetails(false)"
            >

              <option value="">
                Select Name
              </option>

            </select>

          </div>


          <div
            id="balanceCard"
            class="balance-card hidden"
          >

            <div class="balance-left">

              <span>
                CURRENT BALANCE
              </span>

              <strong id="currentBalance">
                0 Tk
              </strong>

            </div>


            <div class="balance-sales">

              <span>
                TOTAL SALES
              </span>

              <strong id="monthlySales">
                0 Tk
              </strong>

            </div>

          </div>


          <div
            id="transactionsSection"
            class="hidden"
          >

            <div class="transactions-header">

              <h3>
                TRANSACTIONS
              </h3>

            </div>


            <div
              id="transactionList"
              class="transaction-list"
            ></div>

          </div>


          <div
            id="detailsMessage"
            class="message"
          ></div>

        </main>

      </section>

    </main>

  </div>

</section>


<!-- =====================================================
     VIEWER
===================================================== -->

<section id="viewerPage" class="page">

  <div class="app-container">

    <header class="top-header">

      <div>

        <h2>
          VIEWER PANEL
        </h2>

        <span id="viewerWelcome">
          Welcome
        </span>

      </div>

      <button
        class="logout-btn"
        onclick="logout()"
      >🚪</button>

    </header>


    <main class="viewer-container">

      <div class="balance-card">

        <div class="balance-left">

          <span>
            CURRENT BALANCE
          </span>

          <strong id="viewerBalance">
            0 Tk
          </strong>

        </div>


        <div class="balance-sales">

          <span>
            TOTAL SALES
          </span>

          <strong id="viewerMonthlySales">
            0 Tk
          </strong>

        </div>

      </div>


      <div class="sales-row">

        <div class="sales-filter">

          <select
            id="viewerYear"
            class="year-select"
            onchange="loadViewerDetails(true)"
          ></select>


          <select
            id="viewerMonth"
            class="month-select"
            onchange="loadViewerDetails(true)"
          ></select>

        </div>

      </div>


      <div class="viewer-history">

        <h3>
          TRANSACTIONS
        </h3>

        <div
          id="viewerTransactionList"
          class="transaction-list"
        ></div>

      </div>


      <div
        id="viewerMessage"
        class="message"
      ></div>

    </main>

  </div>

</section>


<!-- =====================================================
     LOADING
===================================================== -->

<div
  id="loading"
  class="loading hidden"
>

  <div class="spinner"></div>

  <span>
    Loading...
  </span>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbwjo8vQO3GmnVKTJLJKmoAgHKQequvOtzuO9ySlLSqCAABvGuPvb3X_PeDDMSVu6Fb0Tg/exec';


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentUser=null;

let salesOptions=[];
let paymentOptions=[];

let namesCache=null;
let namesLoading=null;

let optionsLoaded=false;
let optionsLoading=null;

let detailsRequestId=0;
let viewerRequestId=0;

let saveRequestRunning=false;


/* =====================================================
   DOM CACHE
===================================================== */

const DOM={};


function cacheDOM(){

  const ids=[

    'loginPage',
    'adminPage',
    'viewerPage',

    'username',
    'password',
    'loginMessage',

    'adminWelcome',
    'viewerWelcome',

    'transactionDate',
    'transactionAmount',
    'transactionName',
    'transactionType',
    'transactionMethod',
    'methodLabel',

    'saleBtn',
    'paymentBtn',

    'transactionMessage',

    'detailsName',
    'yearSelect',
    'monthSelect',

    'balanceCard',
    'transactionsSection',

    'currentBalance',
    'monthlySales',

    'transactionList',
    'detailsMessage',

    'viewerYear',
    'viewerMonth',

    'viewerBalance',
    'viewerMonthlySales',
    'viewerTransactionList',
    'viewerMessage',

    'loading'

  ];

  ids.forEach(id=>{

    DOM[id]=
      document.getElementById(id);

  });

}


/* =====================================================
   API CALL
===================================================== */

function api(action,params={}){

  return new Promise((resolve,reject)=>{

    const callbackName=
      'cb_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2);


    const script=
      document.createElement('script');


    const query=
      new URLSearchParams();


    query.set(
      'action',
      action
    );


    query.set(
      'callback',
      callbackName
    );


    Object.keys(params).forEach(key=>{

      const value=
        params[key];

      if(
        value!==undefined &&
        value!==null
      ){

        query.set(
          key,
          String(value)
        );

      }

    });


    let finished=false;


    const timeout=
      setTimeout(()=>{

        if(finished)return;

        finished=true;

        cleanup();

        reject(
          new Error(
            'Server request timed out. Please try again.'
          )
        );

      },20000);


    function cleanup(){

      clearTimeout(timeout);

      if(script.parentNode){

        script.parentNode
          .removeChild(script);

      }

      try{

        delete window[callbackName];

      }catch(e){}

    }


    window[callbackName]=
      function(result){

        if(finished)return;

        finished=true;

        cleanup();

        resolve(result);

      };


    script.onerror=function(){

      if(finished)return;

      finished=true;

      cleanup();

      reject(
        new Error(
          'Unable to connect to server.'
        )
      );

    };


    script.async=true;

    script.src=
      API_URL +
      '?' +
      query.toString();


    document.head.appendChild(
      script
    );

  });

}

/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

  if(
    !DOM.username ||
    !DOM.password
  ){

    return;

  }


  const username=
    DOM.username.value.trim();


  const password=
    DOM.password.value.trim();


  DOM.loginMessage.textContent='';


  DOM.loginMessage.classList.remove(
    'success'
  );


  if(
    !username ||
    !password
  ){

    DOM.loginMessage.textContent=
      'Username and password required.';

    return;

  }


  showLoading();


  try{

    const result=
      await api(
        'login',
        {
          username:username,
          password:password
        }
      );


    if(
      !result ||
      !result.success
    ){

      hideLoading();

      DOM.loginMessage.textContent=
        result?.message ||
        'Login failed.';

      return;

    }


    currentUser=result;


    localStorage.setItem(
      'transactionUser',
      JSON.stringify(
        currentUser
      )
    );


    const role=
      String(
        result.role || ''
      )
      .trim()
      .toLowerCase();


    if(role==='admin'){

      DOM.adminWelcome.textContent=
        'Welcome, ' +
        (result.name || 'Admin');


      showPage(
        'adminPage'
      );


      showAdminSection(
        'add'
      );


      setToday();


      hideLoading();


      /*
       Background preload.
       Login complete হওয়ার জন্য
       এগুলোর response-এর অপেক্ষা করবে না।
      */

      preloadAdminData();


      return;

    }


    if(role==='viewer'){

      DOM.viewerWelcome.textContent=
        'Welcome, ' +
        (result.name || '');


      setupMonthSelect(
        'viewerMonth',
        'viewerYear'
      );


      showPage(
        'viewerPage'
      );


      hideLoading();


      loadViewerDetails();


      return;

    }


    hideLoading();


    DOM.loginMessage.textContent=
      'Unknown account type.';


  }catch(error){

    hideLoading();

    DOM.loginMessage.textContent=
      error?.message ||
      'Something went wrong.';

  }

}

/* =====================================================
   NAME DROPDOWN
===================================================== */

function populateNameSelect(
  elementId
){

  const select=
    document.getElementById(
      elementId
    );


  if(!select)return;


  /*
   Existing selection save করছি।
   Background refresh-এর সময় customer
   selected থাকলে সেটা হারাবে না।
  */

  const oldValue=
    select.value;


  select.innerHTML=
    '<option value="">Select Name</option>';


  if(
    !Array.isArray(namesCache) ||
    !namesCache.length
  ){

    return;

  }


  const fragment=
    document.createDocumentFragment();


  namesCache.forEach(name=>{

    const option=
      document.createElement(
        'option'
      );


    option.value=
      name;


    option.textContent=
      name;


    fragment.appendChild(
      option
    );

  });


  select.appendChild(
    fragment
  );


  /*
   Old selected customer থাকলে
   refresh-এর পরেও selected থাকবে।
  */

  if(
    oldValue &&
    namesCache.includes(
      oldValue
    )
  ){

    select.value=
      oldValue;

  }

}


/* =====================================================
   LOAD NAMES
===================================================== */

function loadNames(
  forceRefresh=false
){

  /*
   Cache থাকলে প্রথমে সঙ্গে সঙ্গে
   dropdown render হবে।
  */

  if(
    Array.isArray(namesCache)
  ){

    populateNameSelect(
      'transactionName'
    );


    populateNameSelect(
      'detailsName'
    );


    /*
     Force refresh না হলে
     cached result-ই যথেষ্ট।
    */

    if(!forceRefresh){

      return Promise.resolve(
        namesCache
      );

    }

  }


  /*
   একই সময়ে request already চলছে।
   Duplicate request বন্ধ।
  */

  if(namesLoading){

    return namesLoading;

  }


  if(!currentUser){

    return Promise.resolve(
      namesCache || []
    );

  }


  namesLoading=
    api(
      'getNames',
      {
        token:currentUser.token
      }
    )
    .then(result=>{

      if(
        result?.success &&
        Array.isArray(
          result.names
        )
      ){

        /*
         Duplicate names remove।
        */

        namesCache=
          [...new Set(
            result.names
              .map(name=>
                String(name).trim()
              )
              .filter(Boolean)
          )];


        populateNameSelect(
          'transactionName'
        );


        populateNameSelect(
          'detailsName'
        );

      }


      return namesCache || [];

    })
    .catch(error=>{

      console.error(
        'Names refresh:',
        error
      );


      /*
       Server fail করলেও existing
       cache থাকলে সেটা থাকবে।
      */

      return namesCache || [];

    })
    .finally(()=>{

      namesLoading=null;

    });


  return namesLoading;

}


/* =====================================================
   OPTIONS
===================================================== */

function loadOptions(){

  if(optionsLoaded){

    selectType(
      DOM.transactionType.value ||
      'বিক্রয়'
    );


    return Promise.resolve();

  }


  if(optionsLoading){

    return optionsLoading;

  }


  if(!currentUser){

    return Promise.resolve();

  }


  optionsLoading=
    api(
      'getOptions',
      {
        token:currentUser.token
      }
    )
    .then(result=>{

      if(result?.success){

        salesOptions=
          Array.isArray(
            result.sales
          )
            ? result.sales
            : [];


        paymentOptions=
          Array.isArray(
            result.payments
          )
            ? result.payments
            : [];


        optionsLoaded=true;


        selectType(
          DOM.transactionType.value ||
          'বিক্রয়'
        );

      }


      return result;

    })
    .catch(error=>{

      console.error(
        'Options:',
        error
      );


      return null;

    })
    .finally(()=>{

      optionsLoading=null;

    });


  return optionsLoading;

}

   TYPE
===================================================== */

function selectType(type){

  DOM.transactionType.value=
    type;


  const isSale=
    type==='বিক্রয়';


  DOM.saleBtn.classList.toggle(
    'active',
    isSale
  );


  DOM.paymentBtn.classList.toggle(
    'active',
    !isSale
  );


  DOM.methodLabel.textContent=
    isSale
      ? 'বিক্রয়ের ধরন'
      : 'পেমেন্টের ধরন';


  const options=
    isSale
      ? salesOptions
      : paymentOptions;


  const select=
    DOM.transactionMethod;


  const oldValue=
    select.value;


  select.innerHTML=
    '<option value="">Select</option>';


  if(!options.length){

    if(!optionsLoaded){

      loadOptions();

    }

    return;

  }


  const fragment=
    document.createDocumentFragment();


  options.forEach(item=>{

    const option=
      document.createElement(
        'option'
      );


    option.value=
      item;


    option.textContent=
      item;


    fragment.appendChild(
      option
    );

  });


  select.appendChild(
    fragment
  );


  /*
   Type change না হলে previous option
   possible হলে preserve করবে।
  */

  if(
    oldValue &&
    options.includes(oldValue)
  ){

    select.value=
      oldValue;

  }

}


/* =====================================================
   AMOUNT FORMAT
===================================================== */

function formatInputAmount(value){

  let clean=
    String(value || '')
      .replace(/,/g,'')
      .replace(/[^\d]/g,'');


  if(!clean){

    return '';

  }


  clean=
    clean.replace(
      /^0+(?=\d)/,
      ''
    );


  return Number(clean)
    .toLocaleString('en-IN');

}


/* =====================================================
   AMOUNT INPUT
===================================================== */

function setupAmountInput(){

  const input=
    DOM.transactionAmount;


  if(!input)return;


  input.addEventListener(
    'input',
    ()=>{

      const cursor=
        input.selectionStart;


      const before=
        input.value.slice(
          0,
          cursor
        );


      const digitsBefore=
        before
          .replace(/,/g,'')
          .replace(/[^\d]/g,'')
          .length;


      input.value=
        formatInputAmount(
          input.value
        );


      let newCursor=0;

      let digitCount=0;


      while(
        newCursor<
          input.value.length &&
        digitCount<
          digitsBefore
      ){

        if(
          /\d/.test(
            input.value[newCursor]
          )
        ){

          digitCount++;

        }


        newCursor++;

      }


      try{

        input.setSelectionRange(
          newCursor,
          newCursor
        );

      }catch(e){}

    }
  );


  input.addEventListener(
    'blur',
    ()=>{

      input.value=
        formatInputAmount(
          input.value
        );

    }
  );

}


/* =====================================================
   SAVE TRANSACTION
===================================================== */

async function saveTransaction(){

  if(saveRequestRunning){

    return;

  }


  const date=
    DOM.transactionDate.value;


  const amount=
    DOM.transactionAmount.value
      .replace(/,/g,'');


  const name=
    DOM.transactionName.value;


  const type=
    DOM.transactionType.value;


  const method=
    DOM.transactionMethod.value;


  const message=
    DOM.transactionMessage;


  message.textContent='';


  message.classList.remove(
    'success'
  );


  if(!date){

    message.textContent=
      'Please select a date.';

    return;

  }


  const now=
    new Date();


  const todayString=
    now.getFullYear() +
    '-' +
    String(
      now.getMonth()+1
    ).padStart(2,'0') +
    '-' +
    String(
      now.getDate()
    ).padStart(2,'0');


  if(date>todayString){

    message.textContent=
      'Future date is not allowed.';

    setToday();

    return;

  }


  if(
    !amount ||
    Number(amount)<=0
  ){

    message.textContent=
      'Please enter a valid amount.';

    return;

  }


  if(!name){

    message.textContent=
      'Please select a name.';

    return;

  }


  if(!method){

    message.textContent=
      'Please select an option.';

    return;

  }


  if(!currentUser?.token){

    message.textContent=
      'Session expired. Please login again.';

    return;

  }


  saveRequestRunning=true;


  showLoading();


  try{

    const result=
      await api(
        'addTransaction',
        {
          token:currentUser.token,
          date:date,
          amount:amount,
          name:name,
          type:type,
          method:method
        }
      );


    hideLoading();


    if(result?.success){

      message.textContent=
        result.message ||
        'Transaction added successfully.';


      message.classList.add(
        'success'
      );


      /*
       Form clear
      */

      DOM.transactionAmount.value='';

      DOM.transactionName.value='';

      DOM.transactionMethod.value='';


      setToday();


      /*
       Previous details request invalid.
      */

      detailsRequestId++;


      /*
       IMPORTANT:

       নতুন transaction save হওয়ার পরে
       names-এর cache রেখে background refresh।
      */

      loadNames(true);


      /*
       যদি Check Details-এর customer selected থাকে,
       পরেরবার Check Details খুললেই fresh data আসবে।
      */

    }else{

      message.textContent=
        result?.message ||
        'Failed to save transaction.';

    }

  }catch(error){

    hideLoading();


    message.textContent=
      error?.message ||
      'Failed to save transaction.';

  }finally{

    saveRequestRunning=false;

  }

}


/* =====================================================
   YEAR MONTH
===================================================== */

function setupMonthSelect(
  monthElementId,
  yearElementId
){

  const monthSelect=
    document.getElementById(
      monthElementId
    );


  const yearSelect=
    document.getElementById(
      yearElementId
    );


  if(
    !monthSelect ||
    !yearSelect
  ){

    return;

  }


  /*
   Already initialized হলে আবার
   DOM rebuild করবে না।
  */

  if(
    yearSelect.options.length===5 &&
    monthSelect.options.length===12
  ){

    return;

  }


  const now=
    new Date();


  const currentYear=
    now.getFullYear();


  const currentMonth=
    now.getMonth()+1;


  const yearFragment=
    document.createDocumentFragment();


  for(
    let i=0;
    i<5;
    i++
  ){

    const year=
      currentYear-i;


    const option=
      document.createElement(
        'option'
      );


    option.value=
      year;


    option.textContent=
      year;


    yearFragment.appendChild(
      option
    );

  }


  yearSelect.innerHTML='';

  yearSelect.appendChild(
    yearFragment
  );


  const months=[

    'January',
    'February',
    'March',
    'April',
    'May',
    'June',
    'July',
    'August',
    'September',
    'October',
    'November',
    'December'

  ];


  const monthFragment=
    document.createDocumentFragment();


  months.forEach(
    (month,index)=>{

      const option=
        document.createElement(
          'option'
        );


      option.value=
        index+1;


      option.textContent=
        month;


      monthFragment.appendChild(
        option
      );

    }
  );


  monthSelect.innerHTML='';

  monthSelect.appendChild(
    monthFragment
  );


  yearSelect.value=
    currentYear;


  monthSelect.value=
    currentMonth;

}

/* =====================================================
   CUSTOMER DETAILS
===================================================== */

async function loadCustomerDetails(
  quickReload=false
){

  const name=
    DOM.detailsName.value;


  /*
   Name select না করা থাকলে
   list clear করার দরকার নেই যদি background
   refresh থেকে আসে।

   তবে normal selection change হলে clear।
  */

  if(!name){

    DOM.balanceCard.classList.add(
      'hidden'
    );


    DOM.transactionsSection.classList.add(
      'hidden'
    );


    DOM.transactionList.innerHTML='';


    return;

  }


  const selected=
    getSelectedMonth(
      'monthSelect',
      'yearSelect'
    );


  const requestId=
    ++detailsRequestId;


  /*
   Quick reload হলে কোনো overlay নেই।
   Normal name selection হলে loading থাকবে।
  */

  if(!quickReload){

    showLoading();

  }


  try{

    const result=
      await api(
        'customerDetails',
        {
          token:currentUser.token,
          name:name,
          year:selected.year,
          month:selected.month
        }
      );


    /*
     পুরোনো request হলে result ignore।
    */

    if(
      requestId!==detailsRequestId
    ){

      return;

    }


    if(!quickReload){

      hideLoading();

    }


    if(!result?.success){

      DOM.detailsMessage.textContent=
        result?.message || '';


      return;

    }


    DOM.detailsMessage.textContent='';


    DOM.currentBalance.textContent=
      formatAmount(
        result.currentBalance
      );


    DOM.monthlySales.textContent=
      formatAmount(
        result.totalSales
      );


    DOM.balanceCard.classList.remove(
      'hidden'
    );


    renderTransactions(
      result.transactions,
      'transactionList'
    );


    DOM.transactionsSection.classList.remove(
      'hidden'
    );


  }catch(error){

    if(
      requestId!==detailsRequestId
    ){

      return;

    }


    if(!quickReload){

      hideLoading();

    }


    DOM.detailsMessage.textContent=
      error?.message ||
      'Failed to load details.';

  }

}

/* =====================================================
   TRANSACTION RENDER
===================================================== */

function renderTransactions(
  transactions,
  elementId
){

  const container=
    document.getElementById(
      elementId
    );


  if(!container)return;


  container.innerHTML='';


  if(
    !Array.isArray(transactions) ||
    !transactions.length
  ){

    container.innerHTML=
      '<div class="message">No transactions found.</div>';


    return;

  }


  /*
   Newest transaction first।

   Timestamp থাকলে timestamp।
   transactionId / id / rowNumber থাকলে সেটা।
   কিছু না থাকলে backend response order।
  */

  const list=
    transactions
      .map(
        (item,index)=>({

          item:item,

          time:getTransactionTime(
            item,
            index,
            transactions.length
          )

        })
      )
      .sort(
        (a,b)=>
          b.time-a.time
      );


  const fragment=
    document.createDocumentFragment();


  list.forEach(
    ({item})=>{

      const card=
        document.createElement(
          'div'
        );


      const isSale=
        String(
          item.type || ''
        ).trim()==='বিক্রয়';


      card.className=
        'transaction-card ' +
        (
          isSale
            ? 'sale'
            : 'payment'
        );


      /* LEFT */

      const info=
        document.createElement(
          'div'
        );


      info.className=
        'transaction-info';


      const date=
        document.createElement(
          'div'
        );


      date.className=
        'transaction-date';


      date.textContent=
        item.date || '';


      const amount=
        document.createElement(
          'div'
        );


      amount.className=
        'transaction-amount';


      const numericAmount=
        Number(
          String(
            item.amount || ''
          )
          .replace(/,/g,'')
        ) || 0;


      amount.textContent=
        (
          isSale
            ? '+'
            : '−'
        ) +
        formatNumber(
          numericAmount
        ) +
        ' TK';


      const method=
        document.createElement(
          'div'
        );


      method.className=
        'transaction-method';


      method.textContent=
        item.method || '';


      info.appendChild(
        date
      );


      info.appendChild(
        amount
      );


      info.appendChild(
        method
      );


      /* RIGHT */

      const type=
        document.createElement(
          'div'
        );


      type.className=
        'transaction-type';


      type.textContent=
        isSale
          ? 'বিক্রয়'
          : 'পেমেন্ট';


      card.appendChild(
        info
      );


      card.appendChild(
        type
      );


      fragment.appendChild(
        card
      );

    }
  );


  container.replaceChildren(
    fragment
  );

}


/* =====================================================
   TRANSACTION TIME
===================================================== */

function getTransactionTime(
  item,
  index,
  total
){

  /*
   Backend timestamp থাকলে সেটাই priority।
  */

  const timestamp=
    item.timestamp ||
    item.createdAt ||
    item.time ||
    item.datetime;


  if(timestamp){

    const parsed=
      new Date(
        timestamp
      ).getTime();


    if(
      !Number.isNaN(parsed)
    ){

      return parsed;

    }

  }


  /*
   transaction ID / row number থাকলে
   insertion order হিসেবে ব্যবহার।
  */

  const id=
    item.transactionId ||
    item.id ||
    item.rowNumber;


  if(
    id!==undefined &&
    id!==null &&
    id!==''
  ){

    const numericId=
      Number(id);


    if(
      Number.isFinite(
        numericId
      ) &&
      numericId>0
    ){

      return (
        1000000000000 +
        numericId
      );

    }

  }


  /*
   Backend timestamp না দিলে
   response order ধরে newest first।
  */

  return (
    1000000000000 +
    (
      total-index
    )
  );

}


/* =====================================================
   NUMBER
===================================================== */

function formatNumber(number){

  return Number(
    number || 0
  )
  .toLocaleString(
    'en-IN'
  );

}


/* =====================================================
   AMOUNT
===================================================== */

function formatAmount(amount){

  const number=
    Number(
      String(
        amount || ''
      )
      .replace(/,/g,'')
    ) || 0;


  return (
    formatNumber(number) +
    ' Tk'
  );

}


/* =====================================================
   RESTORE SESSION
===================================================== */

function restoreSession(){

  try{

    const saved=
      localStorage.getItem(
        'transactionUser'
      );


    if(!saved){

      showPage(
        'loginPage'
      );

      return;

    }


    const user=
      JSON.parse(
        saved
      );


    if(!user?.token){

      localStorage.removeItem(
        'transactionUser'
      );


      showPage(
        'loginPage'
      );


      return;

    }


    currentUser=
      user;


    const role=
      String(
        user.role || ''
      )
      .trim()
      .toLowerCase();


    if(role==='admin'){

      DOM.adminWelcome.textContent=
        'Welcome, ' +
        (user.name || 'Admin');


      showPage(
        'adminPage'
      );


      showAdminSection(
        'add'
      );


      setToday();


      /*
       Session restore-এর সময়ও
       data background-এ preload হবে।
      */

      preloadAdminData();


      return;

    }


    if(role==='viewer'){

      DOM.viewerWelcome.textContent=
        'Welcome, ' +
        (user.name || '');


      setupMonthSelect(
        'viewerMonth',
        'viewerYear'
      );


      showPage(
        'viewerPage'
      );


      loadViewerDetails();


      return;

    }


    localStorage.removeItem(
      'transactionUser'
    );


    showPage(
      'loginPage'
    );


  }catch(error){

    localStorage.removeItem(
      'transactionUser'
    );


    showPage(
      'loginPage'
    );

  }

}
